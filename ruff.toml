line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "TID"]
ignore = ["RUF012"]

[lint.per-file-ignores]
"**/tests/**" = ["B011"]

[lint.isort]
known-first-party = ["warden", "warden_sdk", "workspaces"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]
