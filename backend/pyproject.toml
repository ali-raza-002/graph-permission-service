[project]
name = "warden"
version = "0.1.0"
description = "Zanzibar-style relationship-based authorization service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "lark>=1.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.115", "httpx>=0.28", "asgi-lifespan>=2.1", "mypy>=1.13", "ruff>=0.8"]

[project.scripts]
warden = "warden.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires a running Postgres (WARDEN_TEST_DATABASE_URL)"]
filterwarnings = ["error"]
