[project]
name = "workspaces-demo"
version = "0.1.0"
description = "Shared workspaces SaaS that delegates every permission decision to Warden"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "structlog>=24.4",
  "warden-sdk[fastapi]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspaces"]

[tool.hatch.build.targets.wheel.force-include]
"src/workspaces/authorization.warden" = "workspaces/authorization.warden"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]
